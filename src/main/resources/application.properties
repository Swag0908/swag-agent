spring.profiles.active=dev
spring.application.name=swag_agent
spring.ai.deepseek.api-key=${DEEPSEEK_API_KEY}


# 数据源
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/swag_ai_agent?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai
spring.datasource.username=root
spring.datasource.password=${MYSQL_PASSWORD}

# 根据 @Entity 自动创建或补齐业务表示例表；不会删除已有数据。
spring.jpa.hibernate.ddl-auto=update


# Observability for tool calling.
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.tracing.sampling.probability=1.0
management.tracing.export.zipkin.endpoint=http://localhost:9411/api/v2/spans
spring.ai.tools.observations.include-content=true
