spring.profiles.active=dev
spring.application.name=swag_agent
spring.ai.deepseek.api-key=${DEEPSEEK_API_KEY}


# 数据源
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/swag_ai_agent?useUnicode=true&characterEncoding=utf-8&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=Asia/Shanghai
spring.datasource.username=root
spring.datasource.password=${MYSQL_PASSWORD}


# 审计表由 Flyway 迁移管理。
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0


# Observability for tool calling.
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.tracing.sampling.probability=1.0
management.tracing.export.zipkin.endpoint=http://localhost:9411/api/v2/spans
spring.ai.tools.observations.include-content=false
management.tracing.baggage.remote-fields=audit_id
management.tracing.baggage.correlation.fields=audit_id
management.tracing.baggage.tag-fields=audit_id

# Restore registered ThreadLocal values from Reactor Context on worker threads.
spring.reactor.context-propagation=auto

# Audit configuration.
audit.zipkin-ui-base-url=http://localhost:9411
audit.confirmation-ttl=10m
audit.include-tool-content=false
# 需要确认的工具名，多个工具使用英文逗号分隔。可用 getCurrentTime 临时演示确认流程。
audit.confirmation-required-tools=
