spring.profiles.active=dev
spring.application.name=swag_agent
spring.ai.deepseek.api-key=${DEEPSEEK_API_KEY}

# ---- 注册闸门（管理员） ----
# 管理员用户名（逗号分隔）。启动时会把它们置为 ADMIN 角色；
# 注册码由系统自动生成存库，管理员登录后在「注册管理」里查看/换新/自定义。
app.auth.admin-usernames=swag

# 把 ResponseStatusException 等的具体 message 带进错误 JSON，供前端展示
server.error.include-message=always

# 联网搜索工具（Tavily）。到 https://app.tavily.com 注册免费 key 后填入环境变量 TAVILY_API_KEY。
web.search.tavily.api-key=${TAVILY_API_KEY}


# 数据源
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=${MYSQL_PASSWORD}


# 审计表由 Flyway 迁移管理。
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0


# ---- 对话记忆 ----
# 短期记忆：Spring AI JDBC 仓库（主 MySQL），表结构由 starter 自动创建
spring.ai.chat.memory.repository.jdbc.initialize-schema=always
# 长期记忆：pgvector 使用独立 PG 连接（见 PgVectorDataSourceConfiguration），
# 关闭它会用主数据源(MySQL)建向量库的自动配置
spring.autoconfigure.exclude=org.springframework.ai.vectorstore.pgvector.autoconfigure.PgVectorStoreAutoConfiguration
# 模型选择：chat 仍用 deepseek；embedding 用本地 Ollama（nomic-embed-text，768 维）
spring.ai.model.chat=deepseek
spring.ai.model.embedding=ollama
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.embedding.model=nomic-embed-text
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.dimensions=768
spring.ai.vectorstore.pgvector.index-type=hnsw
# PG 连接（app.pgvector.* 放在 application-dev.properties，含本机/服务器差异）


# Observability for tool calling.
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.tracing.sampling.probability=1.0
management.tracing.export.zipkin.endpoint=http://localhost:9411/api/v2/spans
spring.ai.tools.observations.include-content=false
management.tracing.baggage.remote-fields=audit_id
management.tracing.baggage.correlation.fields=audit_id
management.tracing.baggage.tag-fields=audit_id

# Restore registered ThreadLocal values from Reactor Context on worker threads.
spring.reactor.context-propagation=auto

# Audit configuration.
# Zipkin 无内置登录，UI 由 nginx 反代到 /zipkin 并做 auth_request 鉴权（见 deploy/nginx-zipkin-admin.conf）。
# 留空 = 生成同源相对链接 /zipkin/traces/{traceId}；本机不经过 nginx 调试时可改回 http://localhost:9411
audit.zipkin-ui-base-url=
audit.confirmation-ttl=10m
audit.include-tool-content=false
# 需要确认的工具名，多个工具使用英文逗号分隔。可用 getCurrentTime 临时演示确认流程。
audit.confirmation-required-tools=

# ---- Zipkin 调用链 UI 的管理员鉴权 ----
# 登录成功后下发一个 HttpOnly Cookie，仅作用于 /zipkin 路径，只被 /auth/zipkin-access 读取：
# nginx 的 auth_request 子请求带不了 Authorization 头，所以需要这个专用票据。
app.zipkin-access.cookie-name=swag_zipkin_token
app.zipkin-access.cookie-path=/zipkin
# 站点走 HTTPS 时置为 true（Secure 属性），纯 http 调试保持 false。
app.zipkin-access.cookie-secure=false
app.zipkin-access.token-ttl=7d

# ---- 技能包（Skill）----
# 一个技能 = 一个含 SKILL.md 的目录（frontmatter 写 name/description，正文是给模型的领域指南），
# 网上下载的 agent skill 目录可直接使用，无需为它写 Java 代码。
#   内置技能：src/main/resources/skills/<name>/SKILL.md，随 jar 发布、团队共享；
#   外部技能：下面 external-root 里的 <name>/SKILL.md，运行时安装/热插拔，同名覆盖内置。
# 技能只作为提示词注入，不会被执行；目录内容变化无需重启，下一轮对话自动生效。
app.skills.external-root=./skills-data
app.skills.auto-inject=true
# 单个技能正文注入上限（字符），超出截断，防止外部技能挤爆上下文。
app.skills.max-body-chars=20000
# 是否允许管理端 POST /auth/admin/skills/install 从 Git 仓库安装技能。
app.skills.install-enabled=true
# 安装时 git clone 超时（秒）。公开 Skill 仓库通常较小，超时后应尽快给出网络故障提示。
app.skills.install-timeout-seconds=60
